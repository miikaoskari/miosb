[binaries]
c = ['clang', '--target=aarch64-none-elf']
c_ld = 'lld'
ar = 'llvm-ar'
objcopy = 'llvm-objcopy'
strip = 'llvm-strip'

[built-in options]
# Bare metal: no hosted libc, no startup files. Applies to subprojects too.
c_args = ['-ffreestanding']
c_link_args = ['-nostdlib']

[host_machine]
system = 'none'
cpu_family = 'aarch64'
cpu = 'cortex-a57'
endian = 'little'
